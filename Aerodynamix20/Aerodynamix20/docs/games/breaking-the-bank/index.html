<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Breaking the Bank</title>
  <style>
    html, body, #game { width: 100%; height: 100%; margin: 0; background: #000; overflow: hidden; }
    ruffle-player { width: 100%; height: 100%; display: block; }
  </style>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.RufflePlayer.config = { publicPath: "./" };
  </script>
  <script src="ruffle.min.js"></script>
</head>
<body>
  <div id="game"></div>
  <script>
    window.addEventListener("DOMContentLoaded", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      document.getElementById("game").appendChild(player);
      player.load("Henry Stickmin - Breaking the Bank.swf");
    });
  </script>
</body>
</html>
