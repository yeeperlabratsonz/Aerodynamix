<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#071226">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Aerodynamix">
    <title>Music - Aerodynamix</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="mobile.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="theme.js"></script>
    <script src="tab-cloak.js"></script>
    <script src="auth-overlay.js" defer></script>
    <script src="boot-screen.js"></script>
    <script src="mobile-nav.js" defer></script>
    <style>
        * { box-sizing: border-box; }
        body {
            min-height: 100vh;
            color: #fff;
            background: #080a0f;
        }

        .music-page {
            width: min(1320px, 100%);
            min-height: 100vh;
            margin: 0 auto;
            padding: clamp(6rem, 10vw, 9rem) clamp(1rem, 4vw, 4rem) 8rem;
        }

        .music-hero {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 2rem;
            padding-bottom: 1.8rem;
            border-bottom: 1px solid rgba(255,255,255,.1);
            margin-bottom: 2.2rem;
        }

        .music-kicker {
            margin: 0 0 .75rem;
            color: #8ca8d5;
            font-size: .68rem;
            font-weight: 800;
            letter-spacing: .2em;
            text-transform: uppercase;
        }

        .music-title {
            margin: 0;
            color: #fff;
            font-size: clamp(2.5rem, 6vw, 5rem);
            font-weight: 900;
            letter-spacing: -.065em;
            line-height: .92;
        }

        .music-subtitle {
            max-width: 460px;
            margin: 1rem 0 0;
            color: rgba(220,229,245,.58);
            font-size: .88rem;
            line-height: 1.65;
        }

        .music-status {
            flex: 0 0 auto;
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .25rem 0;
            color: rgba(220,229,245,.48);
            font-size: .68rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .music-status::before {
            width: .4rem;
            height: .4rem;
            border-radius: 50%;
            background: #61d5ff;
            box-shadow: 0 0 10px rgba(97,213,255,.7);
            content: '';
        }

        .album-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(165px, 1fr));
            gap: 2rem clamp(1rem, 2.2vw, 1.75rem);
        }

        .album-card {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            padding: 0;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 18px;
            color: #fff;
            background: #151922;
            box-shadow: 0 12px 28px rgba(0,0,0,.22);
            cursor: pointer;
            isolation: isolate;
            text-align: left;
            transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
        }

        .album-card:hover,
        .album-card:focus-visible {
            border-color: rgba(143,185,255,.72);
            box-shadow: 0 18px 38px rgba(0,0,0,.35), 0 0 0 3px rgba(76,132,219,.12);
            outline: none;
            transform: translateY(-4px);
        }

        .album-card-art {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        .album-card-placeholder {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255,255,255,.8);
            background:
                radial-gradient(circle at 25% 20%, rgba(255,255,255,.2), transparent 25%),
                linear-gradient(140deg, #263b61, #29305f 58%, #171b27);
            font-size: 3rem;
            font-weight: 900;
            z-index: -2;
        }

        .album-card::after {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 30%, rgba(2,5,12,.05) 46%, rgba(2,5,12,.9) 100%);
            content: '';
            pointer-events: none;
            z-index: -1;
        }

        .album-card-copy {
            position: absolute;
            right: 1rem;
            bottom: 1rem;
            left: 1rem;
        }

        .album-card-title {
            margin: 0;
            overflow: hidden;
            color: #fff;
            font-size: clamp(.88rem, 1.25vw, 1rem);
            font-weight: 800;
            line-height: 1.15;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .album-card-meta {
            margin: .35rem 0 0;
            overflow: hidden;
            color: rgba(225,238,255,.56);
            font-size: .68rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .album-card-play {
            position: absolute;
            top: .9rem;
            right: .9rem;
            display: grid;
            width: 2.35rem;
            height: 2.35rem;
            place-items: center;
            border: 1px solid rgba(255,255,255,.35);
            border-radius: 50%;
            color: #071226;
            background: rgba(255,255,255,.88);
            box-shadow: 0 7px 16px rgba(0,0,0,.28);
            font-size: .8rem;
            opacity: 0;
            transform: translateY(5px);
            transition: opacity .22s ease, transform .22s ease;
        }

        .album-card:hover .album-card-play,
        .album-card:focus-visible .album-card-play {
            opacity: 1;
            transform: translateY(0);
        }

        .music-message {
            display: grid;
            min-height: 220px;
            place-items: center;
            padding: 2rem;
            border: 1px dashed rgba(140,175,225,.24);
            border-radius: 18px;
            color: rgba(220,235,255,.7);
            background: rgba(255,255,255,.018);
            text-align: center;
        }

        .music-message[hidden],
        .album-panel[hidden] {
            display: none;
        }

        .music-message i {
            margin-bottom: .85rem;
            color: rgba(121,180,255,.7);
            font-size: 2rem;
        }

        .music-message h2 {
            margin: 0 0 .55rem;
            color: #fff;
            font-size: 1.15rem;
        }

        .music-message p {
            max-width: 520px;
            margin: 0;
            font-size: .82rem;
            line-height: 1.7;
        }

        .album-panel {
            margin-top: 2.5rem;
            padding: clamp(1rem, 2.5vw, 1.75rem);
            border: 1px solid rgba(255,255,255,.1);
            border-radius: 18px;
            background: #10131a;
            box-shadow: 0 18px 45px rgba(0,0,0,.2);
        }

        .album-panel-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
            margin-bottom: .8rem;
        }

        .album-panel-title {
            margin: 0;
            color: #fff;
            font-size: 1.25rem;
        }

        .album-panel-subtitle {
            margin: .3rem 0 0;
            color: rgba(220,235,255,.55);
            font-size: .76rem;
        }

        .album-close {
            display: grid;
            width: 2.2rem;
            height: 2.2rem;
            place-items: center;
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 50%;
            color: rgba(255,255,255,.7);
            background: rgba(255,255,255,.04);
            cursor: pointer;
        }

        .album-track-list {
            display: grid;
            gap: .4rem;
        }

        .album-track {
            display: flex;
            align-items: center;
            gap: .8rem;
            width: 100%;
            padding: .8rem .35rem;
            border: 0;
            border-bottom: 1px solid rgba(255,255,255,.08);
            border-radius: 0;
            color: rgba(235,244,255,.84);
            background: transparent;
            cursor: pointer;
            text-align: left;
            transition: background .18s ease, border-color .18s ease;
        }

        .album-track:hover,
        .album-track:focus-visible {
            border-bottom-color: rgba(121,180,255,.4);
            background: rgba(255,255,255,.035);
            outline: none;
        }

        .album-track i {
            width: 1.1rem;
            color: #79b4ff;
            text-align: center;
        }

        .album-track-name {
            flex: 1;
            overflow: hidden;
            font-size: .82rem;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .album-track-meta {
            color: rgba(220,235,255,.4);
            font-size: .7rem;
        }

        @media (max-width: 700px) {
            .music-page { padding: calc(5.5rem + env(safe-area-inset-top)) .9rem 6rem; }
            .music-hero { display: block; margin-bottom: 1.35rem; }
            .music-status { margin-top: 1rem; }
            .album-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1.2rem .7rem; }
            .album-card { border-radius: 16px; }
            .album-card-copy { right: .7rem; bottom: .7rem; left: .7rem; }
            .album-card-play { top: .65rem; right: .65rem; opacity: 1; transform: none; }
        }
    </style>
</head>
<body>
    <nav>
        <img src="images/logo.gif" alt="logo" onclick="window.location='index.html'">
        <h1><span class="logo-a" id="logo-a">A</span>ERODYNAMIX</h1>
        <div style="flex:1; display:flex; align-items:center; justify-content:center; gap:0.4vw;">
            <a href="index.html">Games</a>
            <a href="apps.html">Apps</a>
            <a href="media-player.html">Media Player</a>
            <a href="music.html" class="active">Music</a>
            <a href="dynamix-connect.html">Connect</a>
        </div>
        <a href="colors.html">Settings</a>
    </nav>

    <main class="music-page">
        <header class="music-hero">
            <div>
                <p class="music-kicker">Aerodynamix library</p>
                <h1 class="music-title">Dynamix Music</h1>
                <p class="music-subtitle">A clean home for albums, artists, and the tracks you want to play.</p>
            </div>
            <div class="music-status" id="music-status">Connecting to library…</div>
        </header>

        <section class="album-grid" id="album-grid" aria-label="Albums"></section>

        <section class="music-message" id="music-message" hidden>
            <div>
                <i class="fa-solid fa-compact-disc" aria-hidden="true"></i>
                <h2 id="music-message-title">Your albums are almost ready</h2>
                 <p id="music-message-copy">Albums will appear here as they are added to the music library.</p>
            </div>
        </section>

        <section class="album-panel" id="album-panel" hidden>
            <div class="album-panel-head">
                <div>
                    <h2 class="album-panel-title" id="album-panel-title"></h2>
                    <p class="album-panel-subtitle" id="album-panel-subtitle"></p>
                </div>
                <button class="album-close" id="album-close" type="button" aria-label="Close album"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="album-track-list" id="album-track-list"></div>
        </section>
    </main>

    <script src="music-player.js"></script>
    <script src="music-library.js"></script>
    <script src="bubble-overlay.js"></script>
</body>
</html>
